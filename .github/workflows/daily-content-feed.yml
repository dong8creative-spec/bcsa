name: Daily Content Feed

# 매일 07:00 KST(=UTC 22:00, 전날)에 지원사업/뉴스를 자동 수집합니다.
# 수동으로도 바로 실행해볼 수 있도록 workflow_dispatch도 함께 열어둡니다.
on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run daily ingest
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          BIZINFO_API_KEY: ${{ secrets.BIZINFO_API_KEY }}
        run: node scripts/ingest-daily-feed.mjs
